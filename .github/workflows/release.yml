name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build DMG
        env:
          CAM98_DMG_USE_TEMPLATE: "1"
        run: zsh packaging/make-dmg.sh

      - name: Verify DMG contents
        run: |
          set -euo pipefail
          DMG=dist/CleanAlephaMac98.dmg
          test -f "$DMG"
          MOUNT="$(hdiutil attach -readonly -nobrowse "$DMG" | awk '/\/Volumes\//{print $NF; exit}')"
          test -d "$MOUNT/CleanAlephaMac98.app/Contents/MacOS"
          test -e "$MOUNT/Applications"
          test -f "$MOUNT/.background/background.png"
          test -f "$MOUNT/.DS_Store"
          # Captured Finder templates are a few KB; tiny files mean aesthetics never stuck.
          DS_SIZE="$(wc -c < "$MOUNT/.DS_Store" | tr -d ' ')"
          test "$DS_SIZE" -ge 5000
          ls -la "$MOUNT"
          ls -la "$MOUNT/.background"
          hdiutil detach "$MOUNT" >/dev/null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanAlephaMac98.dmg
          path: dist/CleanAlephaMac98.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CleanAlephaMac98.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Скачай **CleanAlephaMac98.dmg**, перетащи в Applications.
            Первый запуск: правый клик → **Открыть**.

            Download the **.dmg**, drag it into Applications.
            First launch: right-click → **Open**.
