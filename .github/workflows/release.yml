name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: zsh packaging/make-dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanAlephaMac98.dmg
          path: dist/CleanAlephaMac98.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CleanAlephaMac98.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Скачай **CleanAlephaMac98.dmg**, перетащи в Applications.
            Первый запуск: правый клик → **Открыть**.

            Download the **.dmg**, drag it into Applications.
            First launch: right-click → **Open**.
